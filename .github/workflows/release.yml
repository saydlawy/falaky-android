name: Release

# Push a tag like v1.0.0 to build a signed release APK and publish it as a GitHub Release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets
        env:
          KS: ${{ secrets.FALAKY_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.FALAKY_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.FALAKY_KEY_ALIAS }}
          KKP: ${{ secrets.FALAKY_KEY_PASSWORD }}
        run: |
          for v in KS KSP KA KKP; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret for $v. See docs/SETUP.md"; exit 1; fi
          done

      - name: Version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "$TAG"
          echo "FALAKY_VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          echo "FALAKY_VERSION_CODE=$((MA * 1000000 + MI * 1000 + PA))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android platform 37.2
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KS: ${{ secrets.FALAKY_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/falaky.jks"
          echo "FALAKY_KEYSTORE_PATH=$RUNNER_TEMP/falaky.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon :core:model:test

      - name: Build signed release APK
        env:
          FALAKY_KEYSTORE_PASSWORD: ${{ secrets.FALAKY_KEYSTORE_PASSWORD }}
          FALAKY_KEY_ALIAS: ${{ secrets.FALAKY_KEY_ALIAS }}
          FALAKY_KEY_PASSWORD: ${{ secrets.FALAKY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify signature and name the file
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/falaky-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum "falaky-${GITHUB_REF_NAME}.apk" > "falaky-${GITHUB_REF_NAME}.apk.sha256")
          cat dist/*.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Falaky $GITHUB_REF_NAME" --generate-notes
