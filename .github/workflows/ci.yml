name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android platform 37.2
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :core:model:test

      - name: Build release APK (unsigned, check only, never published)
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Room schema check
        run: |
          if [ -z "$(git ls-files core/database/schemas)" ]; then
            echo "::warning::No Room schema is committed yet. Download the room-schemas artifact and commit it to core/database/schemas/."
          elif [ -n "$(git status --porcelain core/database/schemas)" ]; then
            echo "::error::Room schema changed without being committed. Commit core/database/schemas and add a migration."
            git status --porcelain core/database/schemas
            exit 1
          fi

      - name: Upload generated Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: core/database/schemas
          if-no-files-found: warn
